# CI — the gate for every PR.
#
# The toolchain is PINNED (1.95.0, matching rust-toolchain.toml) rather than
# `stable`: this repo will eventually build a committed wasm artifact, and that
# is only reproducible against a fixed compiler. dtolnay/rust-toolchain takes its
# version from this file's `toolchain:` input, NOT from rust-toolchain.toml, so
# the two must be changed together.
#
# Actions are SHA-pinned (tag-hijack defense).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      # `--all-features` hides a whole class of breakage: a test or example
      # that imports a feature-gated module compiles there and nowhere else.
      # That is exactly how a prover-gated test sat broken under plain
      # `cargo test` without CI ever noticing. Compiling the default-feature
      # targets is cheap and closes it.
      - name: Test targets compile with default features
        run: cargo test --workspace --no-run

      # Proves the feature gates actually hold: a stray `use verus_sapling::…`
      # in shared code would silently drag the Groth16 prover into a build that
      # is meant to ship without it.
      - name: Build without default features
        run: cargo check -p verus-sdk --no-default-features

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  # The browser half. Two things are checked here that the `test` job cannot:
  # that the crate compiles for `wasm32-unknown-unknown` at all, and that the
  # compiled module behaves under a real JavaScript engine. The host tests
  # exercise the conversions, but `wasm-bindgen` is inert on the host — the
  # glue, the JsValue marshalling and the thrown `Error` are only ever
  # exercised under node.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # This compiles the whole offline half for the browser, not just the
      # binding: a transitive dependency that stops supporting wasm32 breaks the
      # bundle, and it should break here rather than in someone's application.
      - name: Compile for wasm32
        run: cargo check -p verus-wasm --target wasm32-unknown-unknown --all-targets

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build the package
        run: wasm-pack build crates/verus-wasm --target nodejs --out-dir pkg --release

      # The differential: the TypeScript SDK's own daemon-proven bytes, produced
      # by the wasm module, driven from JavaScript.
      - name: Differential and behaviour, under node
        run: node crates/verus-wasm/tests/node/differential.mjs crates/verus-wasm/pkg

      # The published `.d.ts` is hand-written, so it can be wrong in ways no
      # Rust test sees. `types.check.ts` USES it the way an application would —
      # and its `@ts-expect-error` lines fail the build if a rule the API
      # promises (money is a string, unknown fields are refused, the height
      # bound is required) stops being expressed in the types.
      #
      # `requests.exercised.ts` is guard C of the drift guards: it declares one
      # fully populated value per published request interface, so a request type
      # nothing else uses is still type-checked against the shipped `.d.ts`.
      #
      # `declarations.pinned.ts` is generated: it is everything the Rust drift
      # guards believe they read out of `types.d.ts`, written down so that tsc —
      # which reads that file for real, comments and all — has to agree. Without
      # it the guards are only as right as a hand-written parser, which is how
      # every one of the five bypasses this design replaced was built.
      #
      # The command below names none of them, and that is the point:
      # `tests/node/tsconfig.json` includes every `.ts` file in that directory,
      # so this step cannot fall behind the set of checks and there is no second
      # list to keep in step — the mistake #191 exists to stop repeating.
      # CONTRIBUTING.md gives contributors this same one command.
      - name: TypeScript declarations
        run: npx -y -p typescript@5 tsc -p crates/verus-wasm/tests/node

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # A wallet core's dependency tree is key-access code. cargo-deny checks
      # advisories, licenses, and duplicate/banned crates in one pass.
      # Pinned, but not forever: 0.16.4's bundled `rustsec` cannot parse a CVSS
      # 4.0 score, so it started failing to LOAD the advisory database when
      # RUSTSEC-2026-0109 landed — an audit that errors out is an audit that is
      # not running. Bump this when that happens again.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo-deny
        run: cargo deny check

  # The parsers that eat bytes an attacker chooses: transaction deserialization,
  # output-script decoding, base58/WIF, and the hand-written lightwalletd
  # protobuf reader.
  #
  # This is a SMOKE run, not a campaign. Sixty seconds per target against the
  # committed corpus catches a regression that breaks an existing input or a
  # shallow new crash; it does not explore. Real coverage comes from running
  # `cargo fuzz run <target> -- -max_total_time=...` for much longer by hand
  # and committing whatever the corpus grew — see `fuzz/README.md` for what
  # has actually been run.
  #
  # Nightly, and deliberately quarantined to this job: `cargo-fuzz` needs
  # `-Zsanitizer=address`, while every other job here pins 1.95.0 to keep the
  # build reproducible. `fuzz/` is its own workspace so nothing else ever sees
  # a libfuzzer target.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `rust-toolchain.toml` at the repo root pins 1.95.0, and rustup honours it
    # for anything run inside the checkout — including `fuzz/`, and including
    # the `rustc` that cargo-fuzz shells out to. Installing nightly is not
    # enough: without this the job dies on "the option `Z` is only accepted on
    # the nightly compiler", having quietly selected the pinned stable.
    #
    # `RUSTUP_TOOLCHAIN` overrides the file. It does the job of writing
    # `+nightly` on every invocation, and cannot be forgotten on one of them.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # `-runs=0` replays the committed corpus and exits: if a seed that used
      # to pass now crashes or trips an assertion, that fails here before any
      # new input is generated. Cheap, and the part most likely to catch a
      # real regression.
      - name: Replay the committed corpus
        working-directory: fuzz
        run: |
          for target in tx_deserialize output_script base58 lightwalletd_proto; do
            echo "::group::replay $target"
            cargo fuzz run "$target" -- -runs=0
            echo "::endgroup::"
          done

      # Then a short exploration on top. `-malloc_limit_mb=512` is the check
      # that matters beyond panics: a parser that believes a length prefix and
      # allocates accordingly dies here rather than in a wallet.
      - name: Smoke
        working-directory: fuzz
        run: |
          for target in tx_deserialize output_script base58 lightwalletd_proto; do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- \
              -max_total_time=60 -rss_limit_mb=2048 -malloc_limit_mb=512 -print_final_stats=1
            echo "::endgroup::"
          done

      # A crash writes its input to `fuzz/artifacts/`. Without this the job
      # fails with a stack trace and no way to reproduce it.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
