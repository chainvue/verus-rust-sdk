# cargo-deny — the dependency tree of a wallet core is key-access code.

[advisories]
yanked = "deny"

[licenses]
# Permissive only. A copyleft dependency would decide the license of every
# consumer, including closed-source wallets, and that is not a choice this crate
# gets to make for them.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Covers `webpki-roots`, which is Mozilla's CA certificate bundle reached
    # through `ureq` — data, not code. CDLA-Permissive-2.0 is a permissive data
    # licence: no copyleft, no reciprocal obligation on anything that uses the
    # data, and no attribution requirement beyond keeping the notice. It imposes
    # nothing on a consumer of this SDK.
    #
    # It enters only through crates that open sockets — `verus-rpc` and
    # `verus-light` via `ureq`, and `verus-sdk`'s dev-dependency on `reqwest`
    # for the `drive_async` example. The offline crates do not reach it, and a
    # test asserts that.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A wildcard on a crates.io dependency means an unreviewed upgrade can arrive on
# its own, which for key-handling code is not acceptable.
wildcards = "deny"
# Path dependencies inside this workspace are the exception: the crates version
# together and there is no registry resolution to pin. Without this every
# `verus-* = { path = … }` line reads as a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Sapling side may need VerusCoin forks in Phase 4; add them here explicitly
# when that happens rather than loosening the policy.
allow-git = []
