[package]
name = "verus-sdk"
description = "Verus SDK: build and sign offline, look up and broadcast behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# docs.rs builds with no features by default, which would hide the shielded and
# networked halves — and the crate-root docs link into them.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["transparent"]
transparent = ["dep:verus-tx"]
# Seeing shielded funds and building shielded transactions are separately
# priced, because the second costs a Groth16 prover and ~50 MB of parameters:
#   shielded  — trial-decrypt notes, derive ZIP-32 keys. Milliseconds, no bellman.
#   prover    — additionally BUILD t→z / z→z / z→t. Needs the Sapling parameters.
# A balance-only wallet takes the first and stops.
shielded = ["dep:verus-sapling"]
# `verus-flows?/prover` is weak on purpose: it stays inert for an offline build
# that takes the prover without the network, and turns the shielded SPEND path
# on once `verus-flows` is in the tree.
#
# One wart, because Cargo cannot say "only when `light` is also on": with
# `network` + `prover` and no `light`, `verus-flows` is present so its `prover`
# feature fires, which pulls `verus-light` in — while this crate's `light`
# module, and therefore the whole spend API, stays absent. Dead weight in a
# configuration nobody wants; add `light` or drop `prover`.
prover = ["shielded", "verus-sapling/prover", "verus-flows?/prover"]
# bellman's rayon backend: a large speedup natively, and unavailable on wasm32.
multicore = ["shielded", "verus-sapling/multicore"]
# Persist pending state: amounts, UTXOs, identities, partial transactions.
#
# Covers the shielded half too, when the features that supply it are on:
# `DetectedNote` and the `ScanResult` holding it (with the nullifiers, which is
# the pair `unspent` needs), plus `Unsent<T>` and what it carries — so a crash
# between a tens-of-seconds Groth16 proof and the broadcast does not mean paying
# for the proof twice.
#
# `verus-sapling?/serde` and `verus-flows?/serde` are weak: this feature stays
# purely transparent for a build that took neither.
serde = ["verus-tx?/serde", "verus-sapling?/serde", "verus-flows?/serde"]
# The networked half: read chain state and compose lookup → build → sign →
# broadcast into operations, through `verus-rpc` and `verus-flows`. Off by
# default, so the plain build stays socket-free — usable from an air-gapped
# signer, and deterministically testable.
network = ["transparent", "dep:verus-rpc", "dep:verus-flows"]
# Shielded over the network: find, value and witness notes against a
# lightwalletd server. Implies `network` and `shielded`.
light = ["network", "shielded", "dep:verus-light", "verus-flows/shielded"]

[dependencies]
verus-wire = { path = "../verus-wire" }
verus-keys = { path = "../verus-keys" }
verus-tx = { path = "../verus-tx", optional = true }
verus-sapling = { path = "../verus-sapling", optional = true }
verus-rpc = { path = "../verus-rpc", optional = true }
verus-flows = { path = "../verus-flows", optional = true }
verus-light = { path = "../verus-light", optional = true }

[dev-dependencies]
serde_json = "1"
hex = { workspace = true }
# For ONE example: `drive_async`, the native non-blocking driver.
#
# Justification, because this workspace otherwise keeps a deliberately small
# tree. `drive::advance` does no I/O and its `Step::Ask` bodies are documented
# as independent, so a caller *should* fetch them concurrently — and every
# online example here uses the blocking client, leaving that path shown
# nowhere. A desktop wallet's UI thread is async, and a template it can copy
# has to be too.
#
# These are dev-dependencies of the facade crate only. Nothing in any library
# crate gains an async runtime, and `verus-rpc`'s `ureq` remains the only HTTP
# stack the SDK itself ships. The alternative considered was driving the
# existing blocking `ureq` from `tokio::task::spawn_blocking`, which needs no
# new HTTP client — but it teaches the workaround rather than the shape, and a
# wallet author copying it would carry a thread pool they did not need.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
[[example]]
name = "shield"
required-features = ["prover"]

[[example]]
name = "keygen_shielded"
required-features = ["shielded"]

[[example]]
name = "read_notes"
required-features = ["shielded"]

[[example]]
name = "spend_note"
required-features = ["prover"]

[[example]]
name = "spend_note_online"
required-features = ["light", "prover"]

# The online examples: whole operations through the public node. Each one's
# header says whether running it spends testnet coins.
[[example]]
name = "wallet_balance"
required-features = ["network"]

[[example]]
name = "drive_async"
required-features = ["network"]

[[example]]
name = "send_online"
required-features = ["network"]

[[example]]
name = "register_id_online"
required-features = ["network"]

[[example]]
name = "id_login"
required-features = ["network"]

[[example]]
name = "convert_online"
required-features = ["network"]

[[example]]
name = "make_offer_online"
required-features = ["network"]

[[example]]
name = "take_offer_online"
required-features = ["network"]

# The transparent examples need the builders they demonstrate. Without these
# `cargo check -p verus-sdk --no-default-features --examples` fails.
[[example]]
name = "keygen"
required-features = ["transparent"]

# Only needs `verus-keys`, which is unconditional — no feature required.
[[example]]
name = "keygen_phrase"

[[example]]
name = "send"
required-features = ["transparent"]

[[example]]
name = "send_token"
required-features = ["transparent"]

[[example]]
name = "register_id"
required-features = ["transparent"]

[[example]]
name = "update_id"
required-features = ["transparent"]

[[example]]
name = "revoke_id"
required-features = ["transparent"]
