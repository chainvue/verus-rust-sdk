[package]
name = "verus-rpc"
description = "Read chain state and broadcast signed bytes. Never sends a key anywhere."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A blocking HTTP transport, so the crate is usable without wiring one up.
# Off in a wasm build, which supplies its own transport over fetch.
default = ["http"]
http = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls", "json"], optional = true }
verus-tx = { path = "../verus-tx" }

[dev-dependencies]
hex = { workspace = true }
