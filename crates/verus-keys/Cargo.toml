[package]
name = "verus-keys"
description = "Verus keys and addresses: WIF, base58check, R/i-addresses, secp256k1 signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes the raw base58check codec so a fuzz harness can call it directly.
# `base58` is a private module otherwise, reachable only through `Address` and
# `PrivateKey`, which never hand it anything but a 20- or 32-byte payload. Not
# part of the API: the module it enables is `#[doc(hidden)]` and only
# `fuzz/Cargo.toml` turns this on.
fuzzing = []

[dependencies]
k256 = { workspace = true }
sha2 = { workspace = true }
ripemd = { workspace = true }
pbkdf2 = { workspace = true }
bs58 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# The golden-signature test needs a sighash to sign; wire does not depend on
# keys, so this edge only exists for tests.
verus-wire = { path = "../verus-wire" }
