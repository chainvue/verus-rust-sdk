[package]
name = "verus-tx-market"
description = "Trading and co-signing: on-chain offers, partially-signed transactions, and script-layer multisig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
serde = ["dep:serde", "verus-tx-primitives/serde", "verus-tx-transparent/serde", "verus-tx-protocol/serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
verus-tx-primitives = { path = "../verus-tx-primitives" }
verus-tx-transparent = { path = "../verus-tx-transparent" }
verus-tx-protocol = { path = "../verus-tx-protocol" }
verus-wire = { path = "../verus-wire" }
verus-keys = { path = "../verus-keys" }
hex = { workspace = true }

[dev-dependencies]
serde_json = "1"
