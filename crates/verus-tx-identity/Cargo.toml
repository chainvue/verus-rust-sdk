[package]
name = "verus-tx-identity"
description = "The VerusID lifecycle: name commitment, registration, update, revocation, recovery, identity-held spends and message signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
serde = ["dep:serde", "verus-tx-primitives/serde", "verus-tx-transparent/serde", "verus-tx-protocol/serde", "verus-tx-currency/serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
verus-tx-primitives = { path = "../verus-tx-primitives" }
verus-tx-transparent = { path = "../verus-tx-transparent" }
verus-tx-protocol = { path = "../verus-tx-protocol" }
verus-tx-currency = { path = "../verus-tx-currency" }
verus-wire = { path = "../verus-wire" }
verus-keys = { path = "../verus-keys" }
hex = { workspace = true }

[dev-dependencies]
serde_json = "1"
