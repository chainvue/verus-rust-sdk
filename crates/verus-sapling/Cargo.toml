[package]
name = "verus-sapling"
description = "Verus shielded (Sapling) transactions: note scanning, ZIP-32 derivation, and zk proving"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Scanning and key derivation are the light half: no zk-SNARK prover, no ~50 MB
# of proving parameters. A wallet that only needs to FIND its notes and derive
# its keys should not compile bellman.
default = []
prover = ["sapling-crypto/circuit"]
# Serialize the state a shielded wallet has to survive a restart with: the
# notes a scan found and where they sit in the commitment tree. Off by default
# so a consumer that does not persist anything does not carry serde.
serde = ["dep:serde"]
# Off on wasm32 (bellman's rayon backend does not build there); on by default
# for native builds, where it is a large speedup.
multicore = ["sapling-crypto/multicore"]

[dependencies]
sapling-crypto = { workspace = true }
zcash_note_encryption = { workspace = true }
zip32 = { workspace = true }
# Sapling addresses are bech32 (not bech32m).
bech32 = "0.11"
verus-wire = { path = "../verus-wire" }
rand = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
# Integrity-checking the Sapling parameter files before they are trusted.
sha2 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
# Only the `prove_and_verify` example needs these: it runs the same verifier a
# consensus node runs over the proofs we just produced. Versions track
# sapling-crypto 0.7's own graph so no type appears twice.
bellman = "0.14"
bls12_381 = "0.8"
jubjub = "0.10"
redjubjub = "0.8"
group = "0.13"

[[example]]
name = "prove_and_verify"
required-features = ["prover"]

# Imports `build` and `params`, both behind `prover`. Without this stanza
# `cargo test --workspace` (no --all-features) fails to compile — a hole CI
# never saw, because CI always passes --all-features.
[[test]]
name = "diversified_roundtrip"
required-features = ["prover"]
